server {
    listen 3003;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Not an SPA with client-side routes — this just lets index.html handle
    # any stray path instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
